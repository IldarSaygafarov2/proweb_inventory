services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pcinventory}
      POSTGRES_USER: ${POSTGRES_USER:-pcinventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcinventory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pcinventory}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      # Публикуем только на localhost — снаружи сервера порт недоступен,
      # достучаться можно только через системный nginx (проксирует сюда).
      - "127.0.0.1:${HTTP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
