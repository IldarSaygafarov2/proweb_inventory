# Конфиг для СИСТЕМНОГО nginx на сервере (не для docker) — на сервере уже
# есть свой nginx, поднимать ещё один в контейнере не нужно (конфликт по
# порту 80). Этот файл — просто шаблон одного из site-конфигов.
#
# Установка на сервере:
#   sudo cp nginx/pcinventory.conf /etc/nginx/sites-available/pcinventory.conf
#   sudo ln -s /etc/nginx/sites-available/pcinventory.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# backend публикует 8000 порт ТОЛЬКО на 127.0.0.1 (см. docker-compose.yml,
# services.backend.ports) — снаружи сервера доступен только через этот nginx.

server {
    listen 80;
    server_name _;   # или IP/домен сервера, если системный nginx роутит по нескольким server_name

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
